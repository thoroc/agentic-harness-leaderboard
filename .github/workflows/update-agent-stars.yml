name: Update agent stars and Pages

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/configure-pages@v5

      - name: Install CLI dependencies
        run: bun install

      - name: Download previous history from live site
        run: |
          mkdir -p site/public/data/snapshots
          curl -sf "https://pantheon-org.github.io/agentic-harness-leaderboard/data/history.json" \
            -o site/public/data/history.json || echo "No previous history found"

      - name: Generate agent stars data for site
        env:
          TZ: UTC
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun ./agent-stars.ts \
            --output agent-stars.md \
            --json-output site/public/data/latest.json \
            --history-output site/public/data/history.json \
            --snapshot-dir site/public/data/snapshots

      - name: Install and build Astro site
        working-directory: ./site
        run: |
          bun install
          bunx astro build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
