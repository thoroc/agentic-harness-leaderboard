pre-commit:
  commands:
    no-index-imports:
      run: |
        if grep -nE 'from\s+["'\''](.*/)?index["'\'']' {staged_files}; then
          echo "ERROR: Use directory paths ('./foo') instead of '/index' ('./foo/index') in imports."
          exit 1
        fi
      glob: "*.{ts,tsx}"
    format:
      run: biome check --write --no-errors-on-unmatched {staged_files}
      glob: "*.{ts,tsx,js,jsx,json,md}"
    lint:
      run: biome lint --no-errors-on-unmatched {staged_files}
      glob: "*.{ts,tsx,js,jsx,json}"
    typecheck:
      run: bun x tsc -p tsconfig.json --noEmit

pre-push:
  commands:
    test:
      run: bun test
